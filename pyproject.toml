[project]
name = "social-world-model"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch==2.5.0",
    "torchvision==0.20.0",
    "torchaudio==2.5.0",
    "torch-geometric",
    "pyyaml",
    "h5py",
    "numpy",
    "matplotlib",
    "scikit-learn",
    "wandb",
    "optuna"
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
